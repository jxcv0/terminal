[package]
name = "terminal"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
ab_glyph = "0.2.32"
clap = { version = "4.6.6", features = ["derive"] }
egui = "=0.33.3"
egui-wgpu = { version = "=0.33.3", default-features = false }
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard", "wayland", "x11"] }
futures-lite = "2.6.1"
libc = "0.2.190"
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }
vt100 = "0.16.2"
wgpu = { version = "27.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
winit = "0.30.13"
